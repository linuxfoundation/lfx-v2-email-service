---
name: Publish Container Branch

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    name: Publish Container
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: Prepare container tag
        id: container_tag
        env:
          HEAD_REF: "${{ github.head_ref }}"
          PR_NUMBER: "${{ github.event.pull_request.number }}"
        run: |
          set -euo pipefail
          # PR images share the image repository with the main and release
          # pipelines, so the tag is namespaced under pr-<number>- and can
          # never equal a tag those pipelines own (latest, development, semver).
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected pull request number"
            exit 1
          fi
          branch_tag=$(echo "${HEAD_REF//[!_0-9a-zA-Z]/-}" | cut -c -$((124 - ${#PR_NUMBER})))
          container_tag="pr-${PR_NUMBER}-${branch_tag}"
          if [[ ! "$container_tag" =~ ^pr-[0-9]+-[-_0-9a-zA-Z]*$ ]]; then
            echo "::error::Computed PR container tag is outside the pr-<number>- namespace"
            exit 1
          fi
          sha_tag="pr-${PR_NUMBER}-${GITHUB_SHA}"
          if [[ ! "$sha_tag" =~ ^pr-[0-9]+-[0-9a-f]{40}$ ]]; then
            echo "::error::Computed PR SHA tag is outside the pr-<number>- namespace"
            exit 1
          fi
          {
            echo "tag=$container_tag"
            echo "sha_tag=$sha_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Build email-service for PR
        env:
          VERSION: ${{ steps.container_tag.outputs.tag }}
          CONTAINER_TAG: ${{ steps.container_tag.outputs.tag }}
          SHA_TAG: ${{ steps.container_tag.outputs.sha_tag }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          export BUILD_TIME
          GIT_COMMIT=${GIT_COMMIT:0:7}
          export GIT_COMMIT
          ko build github.com/linuxfoundation/lfx-v2-email-service/cmd/email-service \
            -B \
            --platform linux/amd64,linux/arm64 \
            -t "$SHA_TAG" \
            -t "$CONTAINER_TAG" \
            --sbom spdx
