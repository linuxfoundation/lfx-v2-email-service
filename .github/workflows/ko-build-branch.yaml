---
name: Publish Container Branch

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # pull_request runs the workflow definition from the PR itself, so this job
  # holds no registry write access: it only builds the image into an OCI
  # layout artifact. ko-publish-branch.yaml (workflow_run, which always runs
  # the default-branch definition) computes the pr-<number>- tags and pushes.
  publish:
    name: Publish Container
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1
      - name: Build email-service for PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="pr-${PR_NUMBER}"
          export VERSION
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          export BUILD_TIME
          GIT_COMMIT=${GIT_COMMIT:0:7}
          export GIT_COMMIT
          ko build github.com/linuxfoundation/lfx-v2-email-service/cmd/email-service \
            -B \
            --platform linux/amd64,linux/arm64 \
            --push=false \
            --oci-layout-path "$RUNNER_TEMP/oci-layout" \
            --sbom none
      - name: Upload image layout
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oci-layout
          path: ${{ runner.temp }}/oci-layout
          if-no-files-found: error
          retention-days: 1
