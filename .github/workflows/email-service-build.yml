---
name: "Email Service Build"

"on": [pull_request]

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version: stable

      - name: Download Dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: go test ./... -v

      - name: Lint
        # golangci-lint-action downloads a pre-built binary which is compiled
        # against an older Go and cannot read Go 1.26 export data. Install
        # golangci-lint v2 from source (module path /v2) using the Go stable
        # toolchain configured above; the compiled binary bundles x/tools that
        # supports Go 1.26 export data.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...
