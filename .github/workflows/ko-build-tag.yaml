---
name: Publish Tagged Release

"on":
  push:
    tags:
      - v*

env:
  COSIGN_VERSION: v2.5.3
  HELM_VERSION: v3.18.4

permissions:
  contents: read

jobs:
  publish:
    name: Publish Tagged Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_version: ${{ steps.prepare.outputs.app_version }}
      chart_name: ${{ steps.prepare.outputs.chart_name }}
      chart_version: ${{ steps.prepare.outputs.chart_version }}
      image_name: ${{ steps.ko-build.outputs.image_name }}
      image_digest: ${{ steps.ko-build.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Prepare versions and chart name
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only well-formed semver tags may reach image tags, the chart
          # publisher and the argocd dispatch.
          # Strict SemVer 2.0.0 (no build metadata; '+' is invalid in OCI tags).
          num='(0|[1-9][0-9]*)'
          pre_id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_re="^v${num}\.${num}\.${num}(-${pre_id}(\.${pre_id})*)?\$"
          if [[ ! "$RELEASE_TAG" =~ $semver_re ]]; then
            echo "::error::Release tag is not a valid SemVer vX.Y.Z[-prerelease] version"
            exit 1
          fi
          APP_VERSION="${RELEASE_TAG#v}"
          CHART_NAME="$(yq '.name' charts/*/Chart.yaml)"
          CHART_VERSION="${RELEASE_TAG#v}"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "app_version=$APP_VERSION"
            echo "chart_name=$CHART_NAME"
            echo "chart_version=$CHART_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
        with:
          version: v0.19.1

      - name: Build and publish email-service image
        id: ko-build
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.release_tag }}
          VERSION: ${{ steps.prepare.outputs.app_version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          export BUILD_TIME
          GIT_COMMIT=${GIT_COMMIT:0:7}
          export GIT_COMMIT
          IMAGE_REF=$(ko build github.com/linuxfoundation/lfx-v2-email-service/cmd/email-service \
            -B \
            --platform linux/amd64,linux/arm64 \
            -t "$RELEASE_TAG" \
            -t "$VERSION" \
            -t latest \
            --sbom spdx)
          # ko prints the pushed reference as <repo>[:tag]@sha256:<digest>.
          IMAGE_NAME="${IMAGE_REF%@*}"
          IMAGE_DIGEST="${IMAGE_REF##*@}"
          if [[ "${IMAGE_NAME##*/}" == *:* ]]; then
            IMAGE_NAME="${IMAGE_NAME%:*}"
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected ko output, could not determine image digest"
            exit 1
          fi
          {
            echo "image_name=$IMAGE_NAME"
            echo "image_digest=$IMAGE_DIGEST"
          } >> "$GITHUB_OUTPUT"

  sign-image:
    name: Sign email-service image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "${{ env.COSIGN_VERSION }}"

      - name: Login to GitHub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the email-service image in GHCR
        env:
          IMAGE_NAME: ${{ needs.publish.outputs.image_name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

  create-ghcr-image-provenance:
    name: Create email-service image provenance
    needs:
      - publish
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image_name }}
      digest: ${{ needs.publish.outputs.image_digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  release-helm-chart:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.publish-ghcr.outputs.digest }}
      image_name: ${{ steps.publish-ghcr.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Publish Chart to GHCR
        id: publish-ghcr
        # yamllint disable-line rule:line-length
        uses: linuxfoundation/lfx-public-workflows/.github/actions/helm-chart-oci-publisher@17e4144d7ba68f7c3e8c16eece5aed15fd7c2dc8 # main
        with:
          name: ${{ needs.publish.outputs.chart_name }}
          repository: ${{ github.repository }}/chart
          chart_version: ${{ needs.publish.outputs.chart_version }}
          app_version: ${{ needs.publish.outputs.app_version }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "${{ env.COSIGN_VERSION }}"

      - name: Login to GitHub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the Helm chart in GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_IMAGE: ${{ steps.publish-ghcr.outputs.image_name }}
          CHART_DIGEST: ${{ steps.publish-ghcr.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_IMAGE}@${CHART_DIGEST}"

  create-ghcr-helm-provenance:
    needs:
      - release-helm-chart
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.release-helm-chart.outputs.image_name }}
      digest: ${{ needs.release-helm-chart.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  notify-argocd-version-bump:
    name: Notify ArgoCD version-bump job
    needs:
      - publish
      - sign-image
      - create-ghcr-image-provenance
      - release-helm-chart
      - create-ghcr-helm-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7  # v6.0.0
        with:
          role-to-assume: arn:aws:iam::450177423209:role/lfx-v2-github-actions # lfx-core
          aws-region: us-west-2

      - name: Get version-bump GitHub App from AWS Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@3a411b6ec5cace3d626412dd917e7bfeac242cfa  # v3.0.0
        with:
          secret-ids: |
            TRIGGER, /cloudops/managed-secrets/cloud/github/linuxfoundation/lfx-self-serve-release-triggerer-app
          parse-json-secrets: true

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ env.TRIGGER_CLIENT_ID }}
          private-key: ${{ env.TRIGGER_PRIVATE_KEY }}
          owner: linuxfoundation
          repositories: lfx-v2-argocd
          permission-actions: write

      - name: Dispatch create-version-bump-pr.yml
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_VERSION: ${{ needs.publish.outputs.app_version }}
        run: |
          set -euo pipefail
          gh workflow run create-version-bump-pr.yml \
            --repo linuxfoundation/lfx-v2-argocd \
            --ref main \
            -f service=lfx-v2-email-service \
            -f version="${APP_VERSION}" \
            -f source_repo="${GITHUB_REPOSITORY}" \
            -f source_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            -f release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
