---
name: Publish Container Branch Image

# workflow_run always executes this file as it exists on the default branch,
# so a pull request cannot change the tags pushed here. The image layout is
# built by ko-build-branch.yaml from unreviewed code and is treated as data
# only: it is pushed, never executed, and only under pr-<number>- tags.
"on":
  workflow_run:
    workflows:
      - Publish Container Branch
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    name: Publish PR Container
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/linuxfoundation/lfx-v2-email-service/email-service
    steps:
      - name: Prepare container tag
        id: container_tag
        run: |
          set -euo pipefail
          # PR images share the image repository with the main and release
          # pipelines, so the tag is namespaced under pr-<number>- and can
          # never equal a tag those pipelines own (latest, development, semver).
          # The PR number and head SHA come from the workflow_run event, which
          # GitHub populates; nothing here is read from the build run's output.
          head_sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected workflow_run head SHA"
            exit 1
          fi
          prs=$(jq -c --arg sha "$head_sha" '[.workflow_run.pull_requests[]
            | select(.base.ref == "main" and .head.sha == $sha
                     and .head.repo.id == .base.repo.id)]' "$GITHUB_EVENT_PATH")
          if [[ "$(jq 'length' <<<"$prs")" -ne 1 ]]; then
            echo "::warning::No open same-repo pull request into main at ${head_sha}; skipping publish"
            exit 0
          fi
          PR_NUMBER=$(jq -r '.[0].number' <<<"$prs")
          HEAD_REF=$(jq -r '.[0].head.ref' <<<"$prs")
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Unexpected pull request number"
            exit 1
          fi
          branch_tag=$(printf '%s' "${HEAD_REF//[!_0-9a-zA-Z]/-}" | cut -c -$((124 - ${#PR_NUMBER})))
          container_tag="pr-${PR_NUMBER}-${branch_tag}"
          if [[ ! "$container_tag" =~ ^pr-[0-9]+-[-_0-9a-zA-Z]*$ ]]; then
            echo "::error::Computed PR container tag is outside the pr-<number>- namespace"
            exit 1
          fi
          sha_tag="pr-${PR_NUMBER}-${head_sha}"
          if [[ ! "$sha_tag" =~ ^pr-[0-9]+-[0-9a-f]{40}$ ]]; then
            echo "::error::Computed PR SHA tag is outside the pr-<number>- namespace"
            exit 1
          fi
          {
            echo "tag=$container_tag"
            echo "sha_tag=$sha_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Download image layout
        if: ${{ steps.container_tag.outputs.sha_tag != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-layout
          path: ${{ runner.temp }}/oci-layout
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate image layout
        if: ${{ steps.container_tag.outputs.sha_tag != '' }}
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/oci-layout" <<'PY'
          # Accept only ko's shape: one multi-arch index of plain image
          # manifests. A manifest with a subject would make the push also
          # write a sha256-<digest> referrers tag outside pr-<number>-.
          # crane decodes these documents with Go's encoding/json, which
          # matches field names case-insensitively (with Unicode folding)
          # and lets the last duplicate win, so only unambiguous JSON with
          # ASCII, canonically spelled, non-duplicate keys is accepted.
          import hashlib, json, os, re, sys

          layout = sys.argv[1]
          INDEX_TYPES = {
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          }
          IMAGE_TYPES = {
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          }
          CANONICAL = {k.lower(): k for k in (
              "schemaVersion", "mediaType", "artifactType", "config", "layers",
              "manifests", "subject", "annotations", "digest", "size", "urls",
              "data", "platform", "architecture", "os", "os.version",
              "os.features", "variant", "features",
          )}

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def unambiguous(items):
              seen = set()
              for key, _ in items:
                  if not key.isascii():
                      fail("Image layout JSON has a non-ASCII key")
                  folded = key.lower()
                  if folded in seen:
                      fail("Image layout JSON has duplicate keys")
                  seen.add(folded)
                  if CANONICAL.get(folded, key) != key:
                      fail("Image layout JSON has a noncanonical key")
              return dict(items)

          def load(path):
              with open(path, "rb") as f:
                  data = f.read()
              try:
                  doc = json.loads(data.decode("utf-8"), object_pairs_hook=unambiguous)
              except ValueError:
                  fail("Image layout JSON is not valid")
              if not isinstance(doc, dict):
                  fail("Image layout JSON is not an object")
              return data, doc

          def blob(desc):
              digest = desc.get("digest") if isinstance(desc, dict) else None
              if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  fail("Unexpected digest in image layout")
              path = os.path.join(layout, "blobs", "sha256", digest[len("sha256:"):])
              if os.path.islink(path) or not os.path.isfile(path):
                  fail("Image layout blob is missing")
              data, doc = load(path)
              if hashlib.sha256(data).hexdigest() != digest[len("sha256:"):]:
                  fail("Image layout blob does not match its digest")
              return doc

          def plain(doc, types):
              return ("subject" not in doc and "artifactType" not in doc
                      and doc.get("mediaType") in types)

          _, top = load(os.path.join(layout, "index.json"))
          entries = top.get("manifests")
          if (not isinstance(entries, list) or len(entries) != 1
                  or not isinstance(entries[0], dict)
                  or entries[0].get("mediaType") not in INDEX_TYPES):
              fail("Image layout must hold exactly one image index")
          index = blob(entries[0])
          children = index.get("manifests")
          if (not plain(index, INDEX_TYPES) or not isinstance(children, list)
                  or not children):
              fail("Image index has an unexpected shape")
          for child in children:
              if not isinstance(child, dict) or child.get("mediaType") not in IMAGE_TYPES:
                  fail("Image index has an unexpected shape")
              if not plain(blob(child), IMAGE_TYPES):
                  fail("Image manifest has an unexpected shape")
          PY
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        if: ${{ steps.container_tag.outputs.sha_tag != '' }}
        with:
          version: v0.22.1
      - name: Publish email-service for PR
        if: ${{ steps.container_tag.outputs.sha_tag != '' }}
        env:
          CONTAINER_TAG: ${{ steps.container_tag.outputs.tag }}
          SHA_TAG: ${{ steps.container_tag.outputs.sha_tag }}
        run: |
          set -euo pipefail
          crane push "$RUNNER_TEMP/oci-layout" "${IMAGE}:${SHA_TAG}"
          crane tag "${IMAGE}:${SHA_TAG}" "$CONTAINER_TAG"
